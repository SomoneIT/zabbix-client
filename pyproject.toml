[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zabbix-client"
version = "1.0.0"
description = "Unified Zabbix API client for connection management and operations"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Romain GILLE", email = "rgille@somone.fr" },
]
dependencies = [
    "zabbix-utils>=2.0.4",
]

[project.urls]
Homepage = "https://github.com/somoneit/zabbix-client"
Repository = "https://github.com/somoneit/zabbix-client"
Issues = "https://github.com/somoneit/zabbix-client/issues"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
    "ty>=0.0.12",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zabbix_client"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "T20",
]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "zabbix_utils.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
